<div class="widget-frame">
  <div class="widget-frame-header">
    <app-sessions-button [userId]="widgetInput().userId"></app-sessions-button>
  </div>
  <div class="body">
    <app-body-wrapper [conversations]="assistantStore.conversations()"></app-body-wrapper>
  </div>
  <div class="toolbars">
    <app-toolbar-wrapper
      [toolbar]="assistantStore.mode()"
      (qpUpdated)="onQueryParamsUpdated($event)"
    ></app-toolbar-wrapper>
  </div>

  <button matButton (click)="assistantStore.postResponse('Testing')">Send</button>
</div>
